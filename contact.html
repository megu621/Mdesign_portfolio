    <section id="contact">
      <div class="page_title">
        <h2><span class="color_change">C</span>ntact</h2>
        <h3 class="sub_title">お問い合わせ</h3>
        <img src="./images/section_logo_flower.svg" alt="ガーベラ">
      </div>
      <div class="contact_page">
        <p class="contact_page_text">
          お問い合わせはこちらからお願いいたします。<br>内容を確認後メールアドレス宛にご連絡いたします。
        </p>
        <div class="form_area">
          <form
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSfXC5yP16YnvrGlH_ngBznvFfbVm920QdunEkInhts0wWicoA/formResponse"
            method="POST" target="hidden_iframe" onsubmit="submitted=true;">


            <div class="form_box">
              <div class="form">
                <label for="name">お名前</label>
                <input type="text" id="name" name="entry.22399399" class="form_area" placeholder="花山 花子" required>
              </div>
              <div class="form form_style2">
                <label for="name">フリガナ</label>
                <input type="text" id="name" name="entry.1012604389" class="form_area" placeholder="ハナヤマ ハナコ" required>
              </div>
            </div>

            <div class="form_box">
              <div class="form form_style">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="entry.2053208848" class="form_area" placeholder="example@email.com"
                  required>
              </div>

              <div class="form">
                <label for="tel">電話番号（ハイフンなし）</label>
                <input type="tel" id="tel" name="entry.963376207" class="form_area" placeholder="00000000000" required>
              </div>
            </div>
            <div class="form_box2">
              <div class="form">
                <label for="name">お問い合わせ</label>
                <textarea name="entry.549670638" id="field-message" class="form_box2"
                  placeholder="お問い合わせ内容を入力してください"></textarea>
                <!-- <input type="text" id="name" name="entry.549670638" class="form_area" placeholder="お問い合わせ内容を入力してください"
              required> -->
              </div>
            </div>
            <div class="contact_text contact_btn2">
              <button type="submit">送信する</button>
            </div>
          </form>

        </div>
      </div>
    </section>
  </main>
